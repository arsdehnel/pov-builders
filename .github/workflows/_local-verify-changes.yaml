name: Verify Changes

on:
  pull_request:
    branches: [main]

jobs:
  lint-code:
    uses: ./.github/workflows/lint-code.yaml
    permissions:
      contents: read

  lint-commits:
    uses: ./.github/workflows/lint-commits.yaml
    permissions:
      contents: read

  run-tests:
    uses: ./.github/workflows/run-tests.yaml
    permissions:
      contents: read
