when:
  - event: ["push", "manual"]
    branch: ["main", "starting-tangled-ci"]

engine: nixery

dependencies:
  nixpkgs:
    - coreutils
    - gnused
    - nodejs_24
    - biome
    - esbuild

steps:
  - name: Install
    command: npm install --no-package-lock --legacy-peer-deps

  - name: Lint
    command: npm run types:check && biome check && npm run knip:check

  - name: Build
    command: ESBUILD_BINARY_PATH=$(which esbuild) npm run build
