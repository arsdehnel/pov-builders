when:
  - event: ["push", "pull_request", "manual"]

engine: microvm
image: nixos

dependencies:
  - nodejs_26
  - pnpm

steps:
  # pnpm v12 tries to self-manage by downloading a native binary to match the
  # packageManager field, which fails on NixOS. Disable that behavior so it
  # uses the nix-patched pnpm binary directly. Also disable corepack shims in
  # case corepack is what's intercepting and triggering the download.
  - name: Configure pnpm
    command: corepack disable || true && echo 'manage-package-manager-versions=false' >> ~/.npmrc

  - name: Install dependencies
    command: pnpm install --frozen-lockfile

  - name: Lint
    command: pnpm ci:lint

  - name: Tests
    command: pnpm ci:tests
