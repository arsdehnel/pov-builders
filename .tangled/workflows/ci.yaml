when:
  - event: ["push", "pull_request", "manual"]

engine: microvm
image: nixos

dependencies:
  - nodejs_26

steps:
  - name: Install pnpm
    command: npm install -g pnpm@12.7.0
    environment:
      NPM_CONFIG_PREFIX: /usr/local

  - name: Install dependencies
    command: pnpm install --frozen-lockfile

  - name: Lint
    command: pnpm ci:lint

  - name: Tests
    command: pnpm ci:tests
