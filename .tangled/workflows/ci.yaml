when:
  - event: ["push", "pull_request", "manual"]

engine: microvm
image: nixos

dependencies:
  - nodejs_26

steps:
  - name: Install pnpm
    command: npm install --prefix /workspace/.pnpm pnpm@12.7.0

  - name: Install dependencies
    command: PATH="/workspace/.pnpm/node_modules/.bin:$PATH" pnpm install --frozen-lockfile

  - name: Lint
    command: PATH="/workspace/.pnpm/node_modules/.bin:$PATH" pnpm ci:lint

  - name: Tests
    command: PATH="/workspace/.pnpm/node_modules/.bin:$PATH" pnpm ci:tests
