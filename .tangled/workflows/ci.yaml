when:
  - event: ["push", "manual"]
    branch: ["main", "starting-tangled-ci"]

engine: "nixery"

dependencies:
  nixpkgs:
    - coreutils
    - gnused
    - nodejs_24
    - pnpm

steps:
  - name: Install dependencies
    command: pnpm install --frozen-lockfile

  - name: Lint
    command: pnpm ci:lint

  - name: Tests
    command: pnpm ci:tests
