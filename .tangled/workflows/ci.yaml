when:
  - event: ["push", "manual"]
    branch: ["main", "starting-tangled-ci"]

engine: nixery

dependencies:
  nixpkgs:
    - coreutils
    - gnused
    - nodejs_24
    - biome
    - esbuild

steps:
  - name: Lint
    command: tsc && biome check && npx knip

  - name: Build
    command: ESBUILD_BINARY_PATH=$(which esbuild) npm run build
