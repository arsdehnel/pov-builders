when:
  - event: ["push", "pull_request", "manual"]

engine: microvm
image: almalinux10

steps:
  - name: Install Node.js
    command: dnf install -y nodejs

  - name: Install dependencies
    command: pnpm install --frozen-lockfile

  - name: Lint
    command: pnpm ci:lint

  - name: Tests
    command: pnpm ci:tests
