when:
  - event: ["push", "pull_request", "manual"]

engine: microvm
image: almalinux10

steps:
  - name: Install Node.js
    command: |
      curl -fsSL https://raw.githubusercontent.com/mklement0/n-install/stable/bin/n-install | bash -s 26

      # Node.js already installs during n-install, but you can also install it manually:
      #   n install 26

      # Verify the Node.js version:
      node -v # Should print "v26.13.1".

      # Verify npm version:
      npm -v # Should print "11.20.0".

  - name: Install dependencies
    command: pnpm install --frozen-lockfile

  - name: Lint
    command: pnpm ci:lint

  - name: Tests
    command: pnpm ci:tests
