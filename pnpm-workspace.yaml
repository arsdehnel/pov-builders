# pnpm 11 no longer reads the package.json "pnpm" field; these projects are
# also installed standalone (tarball E2E envs, create-rwsdk output), so they
# carry their own build-script approvals.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  rwsdk-atp: true
  rwsdk-atp@git+https://tangled.org/arsdehnel.com/rwsdk-atp.git#e9670044d2d708d25ff02e3b3803970f19378d1d: true
  core-js: true
  "@parcel/watcher": true
minimumReleaseAgeExclude:
  - "@arsdehnel/rwsdk-atp@1.0.1 || 1.0.2"
overrides:
  undici: "^8"
patchedDependencies:
  solid-js@1.9.19: patches/solid-js@1.9.19.patch
