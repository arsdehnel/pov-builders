# pnpm 11 no longer reads the package.json "pnpm" field; these projects are
# also installed standalone (tarball E2E envs, create-rwsdk output), so they
# carry their own build-script approvals.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  rwsdk-atp@git+https://tangled.org/arsdehnel.com/rwsdk-atp.git#f05bd294ae398d1177334514bcb34e753f84cbff: true
  core-js: true
overrides:
  rwsdk-atp: link:../rwsdk-atp
  undici: "^8"
patchedDependencies:
  solid-js@1.9.19: patches/solid-js@1.9.19.patch
