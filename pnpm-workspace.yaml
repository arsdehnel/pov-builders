# pnpm 11 no longer reads the package.json "pnpm" field; these projects are
# also installed standalone (tarball E2E envs, create-rwsdk output), so they
# carry their own build-script approvals.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  rwsdk-atp@git+https://tangled.org/arsdehnel.com/rwsdk-atp.git#efb1b7523a58ede74bc85e756c52ac8f4a1a8e6d: true
  core-js: true
overrides:
  undici: "^8"
