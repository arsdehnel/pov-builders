# pnpm 11 no longer reads the package.json "pnpm" field; these projects are
# also installed standalone (tarball E2E envs, create-rwsdk output), so they
# carry their own build-script approvals.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  rwsdk-atp@git+https://tangled.org/arsdehnel.com/rwsdk-atp.git#cebf8a2b45a4e14ad09d791b49c4e3a3fac5201a: true
  core-js: true
overrides:
  undici: "^8"
