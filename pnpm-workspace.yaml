# pnpm 11 no longer reads the package.json "pnpm" field; these projects are
# also installed standalone (tarball E2E envs, create-rwsdk output), so they
# carry their own build-script approvals.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  rwsdk-atp: true
  rwsdk-atp@git+https://tangled.org/arsdehnel.com/rwsdk-atp.git#7a4b8e8006d71eb8140ab4115ded38029de477ed: true
  core-js: true
  "@parcel/watcher": true
overrides:
  undici: "^8"
patchedDependencies:
  solid-js@1.9.19: patches/solid-js@1.9.19.patch
